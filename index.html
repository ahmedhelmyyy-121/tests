<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big Five Personality Test</title>

<meta property="og:title" content="Big Five Personality Test, 30 facets">

<style>
:root{--bg:#0e1222;--card:#171d36;--card2:#202849;--tx:#eef1ff;--mut:#a3acd6;--ac:#7c8cff;--ac2:#5eead4;--warn:#fbbf24;--line:#2a3262}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.65;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom))}
.wrap{max-width:660px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-weight:800;color:var(--ac2)}
.lang{background:var(--card2);color:var(--tx);border:1px solid #333c6b;border-radius:99px;padding:8px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.card{background:var(--card);border-radius:18px;padding:20px;margin-top:14px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
h1{font-size:26px;margin:4px 0 8px;line-height:1.25}
h2{font-size:19px;margin:0 0 8px}
p{margin:8px 0;color:var(--mut)}
ul{margin:6px 0;padding-inline-start:20px;color:var(--mut)} li{margin:5px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;color:#0b1020;background:linear-gradient(90deg,var(--ac),var(--ac2));margin-top:14px;cursor:pointer;font-family:inherit}
.btn.sec{background:var(--card2);color:var(--tx)}
.btn:disabled{opacity:.4}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px}
.bar.s{height:6px}
.prog{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:6px}
.item{padding:16px 0;border-top:1px solid var(--line)}
.item.first{border-top:0}
.it{font-size:18px;font-weight:600;margin-bottom:12px;line-height:1.55}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:2px solid #333c6b;background:var(--card2);color:var(--tx);border-radius:12px;padding:9px 2px 8px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:68px}
.scale button b{font-size:18px}
.scale button small{font-size:10.5px;line-height:1.2;opacity:.85;font-weight:600;text-align:center}
.scale button.on{background:var(--ac);border-color:var(--ac);color:#0b1020}
.hide{display:none!important}
.big{font-size:28px;font-weight:800;margin:2px 0;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.dom{padding:16px 0;border-top:1px solid var(--line)}
.dom:first-of-type{border-top:0;padding-top:0}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dh b{font-size:17px}.dh span.p{font-weight:800;color:var(--ac2);font-size:19px}
.chip{display:inline-block;font-size:12px;background:var(--card2);color:var(--mut);border-radius:99px;padding:1px 10px;margin-inline-start:6px;font-weight:600;white-space:nowrap}
.fac{margin:12px 0 0;padding:10px 12px;background:var(--card2);border-radius:12px}
.fac .fh{display:flex;justify-content:space-between;font-size:15px;font-weight:700;margin-bottom:5px}
.fac .ft{font-size:14px;color:var(--mut);margin-top:6px}
.note{font-size:13px;color:var(--mut)}
.warn{color:var(--warn)}
svg text{fill:var(--tx);font-family:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row2 .btn{margin-top:10px;font-size:15px;padding:13px 8px}
textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid #333c6b;border-radius:12px;padding:10px;font-size:14px;font-family:monospace;direction:ltr;resize:none}
.box{background:var(--card2);border-radius:14px;padding:14px;margin-top:14px}
.msg{text-align:center;color:var(--ac2);min-height:22px;margin-top:8px}
.tag{font-size:12px;color:var(--mut)}
details{margin-top:10px;color:var(--mut)} summary{cursor:pointer;font-weight:700;color:var(--tx)}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><div class="brand">Big Five · 30 facets</div><button class="lang" id="lang">عربي مصري</button></div>

 <section id="start" class="card">
  <h1 data-t="h1"></h1>
  <button class="btn" id="go" data-t="begin"></button>
  <button class="btn sec hide" id="resume"></button>
  <div id="savedbox" class="box hide"><b data-t="savedT"></b><p data-t="savedP"></p><textarea id="codeout" rows="3" readonly></textarea><button class="btn sec" id="codecopy" data-t="copycode"></button><div class="msg" id="savemsg"></div></div>
  <details><summary data-t="codeS"></summary><p data-t="codeP"></p><textarea id="codein" rows="3" placeholder="0123..."></textarea><button class="btn sec" id="codego" data-t="codego"></button><div class="msg" id="codemsg"></div></details>
  <details><summary data-t="aboutS"></summary><div id="about1"></div></details>
 </section>

 <section id="quiz" class="card hide">
  <div class="prog"><span id="pg"></span><span id="pc"></span></div>
  <div class="bar"><i id="fill" style="width:0"></i></div>
  <div id="items"></div>
  <button class="btn" id="next"></button>
  <button class="btn sec" id="prev"></button>
  <div class="row2"><button class="btn sec" id="save"></button><button class="btn sec" id="fin"></button></div>
  <p class="note" id="finnote" style="text-align:center"></p>
 </section>

 <section id="r1" class="card hide">
  <div class="tag" data-t="yourprofile"></div>
  <div class="big" id="arch"></div>
  <p id="archd" style="color:var(--tx)"></p>
  <p id="basis" class="note"></p>
  <div id="radar" style="margin:8px auto;max-width:340px"></div>
 </section>
 <section id="r2" class="card hide"><h2 data-t="domH"></h2><div id="doms"></div></section>
 <section id="r3" class="card hide"><h2 data-t="standH"></h2><div id="stand"></div></section>
 <section id="r4" class="card hide"><h2 data-t="interact"></h2><div id="combos"></div></section>
 <section id="r5" class="card hide">
  <h2 data-t="quality"></h2><p id="qual"></p>
  <details open><summary data-t="aboutS"></summary><div id="about2"></div></details>
  <button class="btn" id="more" data-t="more"></button>
  <button class="btn sec" id="share" data-t="share"></button>
  <button class="btn sec" id="again" data-t="again"></button>
  <div class="msg" id="msg"></div>
 </section>
</div>

var ABOUT={
en:'<p><b>Model.</b> The Five-Factor Model (Costa &amp; McCrae, 1992), the most heavily researched framework in personality science. It splits personality into five domains (Openness, Conscientiousness, Extraversion, Agreeableness, Neuroticism), each with six facets, 30 in total.</p><p><b>Structure.</b> Four questions per facet, half worded in the opposite direction to catch careless or agree-with-everything answering, the same layout as the IPIP-NEO-120 (Johnson, 2014, Journal of Research in Personality, 51, 78-89), built on Goldberg&#39;s public-domain IPIP item pool (ipip.ori.org).</p><p><b>Honest limits.</b> The questions here are our own plain-language rewrites aimed at the same facets, not the original validated wording, so this exact version has not been psychometrically validated. There is also no population norm table, so scores are your share of the maximum on a 0-100 scale, not a percentile against other people. Use it for self-reflection, not for diagnosis, hiring or clinical decisions. Questions about mood are not a screening for depression: if low mood or worry is affecting your daily life, please talk to a qualified professional.</p>',
ar:'<p><b>النموذج.</b> نموذج العوامل الخمسة (Costa وMcCrae، 1992)، وده أكتر إطار اتبحث في علم نفس الشخصية. بيقسم الشخصية لخمس سمات كبيرة (الانفتاح، يقظة الضمير، الانبساط، المقبولية، العصابية)، كل واحدة فيها ست سمات فرعية، يعني 30 إجمالاً.</p><p><b>البناء.</b> أربع أسئلة لكل سمة فرعية، نصهم صياغتهم عكس الاتجاه عشان نكشف الإجابة المستعجلة أو اللي بتوافق على كل حاجة. ده نفس تقسيم IPIP-NEO-120 (Johnson، 2014، Journal of Research in Personality، 51، 78-89)، المبني على بنك أسئلة IPIP المفتوح للكل (Goldberg، ipip.ori.org).</p><p><b>حدود صريحة.</b> الأسئلة هنا صياغتنا إحنا بلغة سهلة لنفس السمات، مش الصياغة الأصلية المختبرة، فالنسخة دي بالذات مااتختبرتش إحصائياً. ومفيش جدول معايير للسكان، فالدرجات هي نسبتك من الحد الأقصى على مقياس 0 لـ100، مش ترتيبك مقارنة بالناس. استخدمه للتأمل في نفسك، مش للتشخيص ولا التوظيف ولا قرارات علاجية. أسئلة المزاج مش فحص للاكتئاب: لو الإحباط أو القلق بيأثروا على حياتك اليومية، كلم مختص.</p>'};

[function(p){return p.N>=62&&p.O>=62},"The Sensitive Creator","نمط المبدع الحساس","Strong feelings and a wide imagination: a classic artistic profile that benefits from good self-care.","مشاعر قوية وخيال واسع، ملف فني كلاسيكي بيستفيد من العناية الجيدة بنفسك."],
[function(p){return p.A<=38&&p.C>=62},"The Pragmatic Strategist","نمط الاستراتيجي العملي","Results-focused, direct and disciplined. You decide on evidence, not feelings.","تركيزك على النتايج، وأسلوبك مباشر ومنضبط. بتقرر بالأدلة مش بالمشاعر."],
[function(p){return p.E<=38&&p.N<=38},"The Calm Observer","نمط المراقب الهادئ","Self-contained and hard to rattle. You watch, think, then act.","بتكتفي بنفسك وأعصابك باردة. بتراقب وتفكر وبعدين تتحرك."]
];
var COMBO=[
[function(p){return p.N>=62&&p.C>=62},"Perfectionism risk: high standards combined with high worry can turn diligence into self-pressure. Decide in advance what 'good enough' looks like.","خطر الكمالية: معايير عالية مع قلق عالي ممكن يحولوا الاجتهاد لضغط على نفسك. حدد من الأول يعني إيه 'كويس كفاية'."],
[function(p){return p.O>=62&&p.C<=38},"Lots of ideas, less follow-through. Pair ideas with deadlines, or with a partner who finishes things.","أفكار كتير ومتابعة أقل. اربط الأفكار بمواعيد نهائية أو بشريك بيكمّل."],
[function(p){return p.E>=62&&p.A<=38},"Assertive and competitive socially: effective at leading and negotiating, but watch for steamrolling quieter people.","حازم وتنافسي اجتماعياً: فعال في القيادة والتفاوض، بس خلي بالك من تجاهل الأهدى منك."],
[function(p){return p.E<=38&&p.A>=62},"Quietly caring: you build deep one-on-one bonds, though others may not realize how much you notice.","حنية بهدوء: بتبني علاقات عميقة فردية، والناس ممكن متدركش قد إيه إنت واخد بالك."],
[function(p){return p.N>=62&&p.E<=38},"Introversion plus sensitivity means overstimulation hits faster. Protect your downtime on purpose.","الانطواء مع الحساسية معناه إن الإرهاق الحسي بيجي أسرع. احمي وقت راحتك بشكل مقصود."],
[function(p){return p.C<=38&&p.N<=38},"Relaxed about deadlines and unbothered by consequences. That feels good to you, but other people may end up carrying the stress.","مرتاح مع المواعيد ومش بتشيل هم العواقب. ده مريح ليك، بس ممكن غيرك يشيل الضغط."],
[function(p){return p.A>=62&&p.N>=62},"You soak up other people's emotions easily. Boundaries and recovery time matter a lot for you.","بتمتص مشاعر الناس بسهولة. الحدود الشخصية ووقت التعافي مهمين جداً ليك."],
[function(p){return p.E>=62&&p.C<=38},"Energetic and spontaneous: great in the moment, but long-term plans can slip without some structure.","نشاط وعفوية: حلو في اللحظة، بس الخطط الطويلة ممكن تتعثر من غير شوية تنظيم."]
];
var ans={},page=0,PER=10,res=null,order=[],TOT=120,MIN=12;
// ترتيب مخلوط ثابت (بذرة ثابتة)
(function(){var a=[],i;for(i=0;i<TOT;i++)a.push(i);var s=20240611;function r(){s=(s*1664525+1013904223)%4294967296;return s/4294967296}
for(i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}order=a})();
function $(i){return document.getElementById(i)}
function t(o){return o[lang]}
function lv(v){return v>=62?"high":v<=38?"low":"mid"}
function cnt(){var c=0;for(var k in ans)c++;return c}
function save(){try{localStorage.setItem("b5v2",JSON.stringify(ans))}catch(e){}}
function load(){try{var s=localStorage.getItem("b5v2");if(s)return JSON.parse(s)}catch(e){}return null}
function clr(){try{localStorage.removeItem("b5v2")}catch(e){}}
function applyLang(){
 document.documentElement.lang=lang==="ar"?"ar":"en";document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 $("lang").textContent=lang==="ar"?"English":"عربي مصري";
 document.title=lang==="ar"?"اختبار الشخصية Big Five":"Big Five Personality Test";
 var els=document.querySelectorAll("[data-t]");for(var i=0;i<els.length;i++)els[i].textContent=t(UI[els[i].getAttribute("data-t")]);
  $("about1").innerHTML=ABOUT[lang];$("about2").innerHTML=ABOUT[lang];
 $("resume").textContent=t(UI.resume);$("save").textContent=t(UI.savebtn);$("fin").textContent=t(UI.finbtn);$("finnote").textContent=t(UI.finnote);
 if(!$("quiz").classList.contains("hide"))renderPage();
 if(res)renderRes();
}
function show(ids){["start","quiz","r1","r2","r3","r4","r5"].forEach(function(s){$(s).classList.toggle("hide",ids.indexOf(s)<0)});window.scrollTo(0,0)}
function renderPage(){
 var h="";
 for(var k=0;k<PER;k++){
  var g=order[page*PER+k],fi=Math.floor(g/4),ji=g%4,it=F[fi][7][ji];
  h+='<div class="item'+(k?'':' first')+'"><div class="it">'+(lang==="ar"?it[1]:it[0])+'</div><div class="scale" data-g="'+g+'">';
  for(var v=1;v<=5;v++)h+='<button data-v="'+v+'"'+(ans[g]===v?' class="on"':'')+'><b>'+v+'</b><small>'+t(UI.sc[v-1])+'</small></button>';
  h+='</div></div>';
 }
 $("items").innerHTML=h;
 $("pg").textContent=t(UI.pg)+" "+(page+1);
 refresh();
 $("prev").textContent=t(UI.prev);$("prev").classList.toggle("hide",page===0);
 $("next").textContent=page===11?t(UI.fin):t(UI.next);
}
function refresh(){
 var tot=cnt();
 $("fill").style.width=(tot/TOT*100)+"%";$("pc").textContent=tot+" "+t(UI.answered);
 $("fin").disabled=tot<MIN;
}
function firstOpen(){for(var p=0;p<12;p++){for(var k=0;k<PER;k++)if(!ans[order[p*PER+k]])return p}return 11}
function mkcode(){var c="";for(var g=0;g<TOT;g++)c+=(ans[g]||0);return c}
function loadcode(c){c=(c||"").replace(/\s/g,"");if(!new RegExp("^[0-5]{"+TOT+"}$").test(c))return false;var n={};for(var g=0;g<TOT;g++)if(c.charAt(g)!=="0")n[g]=+c.charAt(g);ans=n;save();return true}
function syncStart(){$("resume").classList.toggle("hide",cnt()===0)}
$("lang").onclick=function(){lang=lang==="en"?"ar":"en";applyLang()};
$("go").onclick=function(){ans={};clr();page=0;res=null;$("savedbox").classList.add("hide");show(["quiz"]);renderPage()};
$("resume").onclick=function(){var s=load();if(s&&cnt()===0)ans=s;page=firstOpen();show(["quiz"]);renderPage()};
$("more").onclick=function(){page=firstOpen();show(["quiz"]);renderPage()};
$("items").onclick=function(e){
 var b=e.target.closest("button");if(!b)return;
 var g=+b.parentNode.getAttribute("data-g");ans[g]=+b.getAttribute("data-v");save();
 var bs=b.parentNode.children;for(var i=0;i<bs.length;i++)bs[i].classList.remove("on");b.classList.add("on");refresh();
 var nx=b.closest(".item").nextElementSibling;if(nx){var r=nx.getBoundingClientRect();if(r.bottom>innerHeight-60||r.top<0)nx.scrollIntoView({behavior:"smooth",block:"center"})}
};
$("next").onclick=function(){if(page<11){page++;renderPage();window.scrollTo(0,0)}else if(cnt()>=MIN)compute()};
$("prev").onclick=function(){if(page>0){page--;renderPage();window.scrollTo(0,0)}};
$("fin").onclick=function(){if(cnt()>=MIN)compute()};
$("save").onclick=function(){save();$("codeout").value=mkcode();$("savedbox").classList.remove("hide");$("savemsg").textContent="";syncStart();show(["start"])};
$("codecopy").onclick=function(){var c=$("codeout");c.select();var ok=function(){$("savemsg").textContent=t(UI.codecopied)};try{navigator.clipboard.writeText(c.value).then(ok,function(){document.execCommand("copy");ok()})}catch(e){try{document.execCommand("copy");ok()}catch(x){}}};
$("codego").onclick=function(){if(loadcode($("codein").value)){$("codemsg").textContent=t(UI.codeok);syncStart()}else $("codemsg").textContent=t(UI.codebad)};
$("again").onclick=function(){ans={};clr();res=null;$("savedbox").classList.add("hide");syncStart();show(["start"])};
function compute(){
 var fs=[],fc=[],ds={O:0,C:0,E:0,A:0,N:0},dn={O:0,C:0,E:0,A:0,N:0},sd=0,sdn=0,rawSum=0,rawN=0,hist=[0,0,0,0,0,0];
 for(var fi=0;fi<30;fi++){
  var vals=[],sum=0;
  for(var j=0;j<4;j++){var g=fi*4+j,raw=ans[g];if(!raw)continue;rawSum+=raw;rawN++;hist[raw]++;var v=F[fi][7][j][2]?6-raw:raw;vals.push(v);sum+=v}
  var n=vals.length;fc[fi]=n;
  if(n){var m=sum/n,vr=0;fs[fi]=Math.round((m-1)/4*100);ds[F[fi][0]]+=sum;dn[F[fi][0]]+=n;
   if(n>=2){vals.forEach(function(x){vr+=(x-m)*(x-m)});sd+=Math.sqrt(vr/n);sdn++}}
  else fs[fi]=null;
 }
 var p={};for(var k in ds)p[k]=dn[k]?Math.round((ds[k]/dn[k]-1)/4*100):null;
 var mx=Math.max.apply(null,hist.slice(1)),acq=rawN?rawSum/rawN:3;
 res={f:fs,fc:fc,p:p,n:rawN,sd:sdn?sd/sdn:0,line:rawN>=20&&mx/rawN>=0.85,acq:rawN>=20&&(acq>=4.1||acq<=1.9)};
 renderRes();show(["r1","r2","r3","r4","r5"]);
}
function arch(p){for(var i=0;i<ARCH.length;i++)if(ARCH[i][0](p))return ARCH[i];return[null,"The Balanced Adaptor","نمط المتكيف المتوازن","No single trait dominates your profile, so you adapt your style to the situation.","مفيش سمة واحدة طاغية عليك، فبتغيّر أسلوبك حسب الموقف."]}
function pole(fi,v){var f=F[fi],L=lv(v);return L==="high"?t({en:f[5],ar:f[6]}):L==="low"?t({en:f[3],ar:f[4]}):t(UI.balanced)}
function pl(p){var q={};for(var k in p)q[k]=p[k]==null?50:p[k];return q}
function renderRes(){
 var p=res.p,pp0=pl(p),a=arch(pp0);
 $("arch").textContent=lang==="ar"?a[2]:a[1];
 $("archd").textContent=lang==="ar"?a[4]:a[3];
 $("basis").textContent=t(UI.basis).replace("{n}",res.n)+(res.n<TOT?t(UI.basis2):"");
 $("more").classList.toggle("hide",res.n>=TOT);
 var o=["O","C","E","A","N"],cx=170,cy=150,R=100,pts=[],axes="",labs="",rings="";
 [25,50,75,100].forEach(function(r){var pp=o.map(function(_,i){var an=-Math.PI/2+i*2*Math.PI/5;return(cx+R*r/100*Math.cos(an)).toFixed(1)+","+(cy+R*r/100*Math.sin(an)).toFixed(1)}).join(" ");rings+='<polygon points="'+pp+'" fill="none" stroke="#333c6b" stroke-width="1"/>'});
 o.forEach(function(k,i){var an=-Math.PI/2+i*2*Math.PI/5,pv=p[k]==null?0:p[k];
  axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*Math.cos(an)).toFixed(1)+'" y2="'+(cy+R*Math.sin(an)).toFixed(1)+'" stroke="#333c6b"/>';
  pts.push((cx+R*pv/100*Math.cos(an)).toFixed(1)+","+(cy+R*pv/100*Math.sin(an)).toFixed(1));
  var lx=cx+(R+24)*Math.cos(an),ly=cy+(R+24)*Math.sin(an);
  labs+='<text x="'+lx.toFixed(1)+'" y="'+(ly+4).toFixed(1)+'" font-size="13" font-weight="700" text-anchor="middle">'+k+" "+(p[k]==null?"-":p[k]+"%")+'</text>'});
 $("radar").innerHTML='<svg viewBox="0 0 340 300" width="100%" role="img" aria-label="radar">'+rings+axes+'<polygon points="'+pts.join(" ")+'" fill="rgba(124,140,255,.35)" stroke="#7c8cff" stroke-width="2"/>'+labs+'</svg>';
 var h="";
 DOM.forEach(function(d){
  if(p[d]==null){h+='<div class="dom"><div class="dh"><b>'+t(DN[d])+'</b></div><p>'+t(UI.nodata)+'</p></div>';return}
  var L=lv(p[d]);
  h+='<div class="dom"><div class="dh"><b>'+t(DN[d])+'<span class="chip">'+t(UI[L])+'</span></b><span class="p">'+p[d]+'%</span></div><div class="bar" style="margin:8px 0"><i style="width:'+p[d]+'%"></i></div><p style="margin:4px 0;color:var(--tx)">'+t(DT[d][L])+'</p>';
  for(var fi=0;fi<30;fi++){if(F[fi][0]!==d)continue;var v=res.f[fi];
   if(v==null){h+='<div class="fac"><div class="fh"><span>'+t({en:F[fi][1],ar:F[fi][2]})+'</span></div><div class="ft">'+t(UI.nodata)+'</div></div>';continue}
   h+='<div class="fac"><div class="fh"><span>'+t({en:F[fi][1],ar:F[fi][2]})+'<span class="chip">'+t(UI[lv(v)])+'</span>'+(res.fc[fi]<2?'<span class="chip">'+t(UI.few)+'</span>':'')+'</span><span>'+v+'%</span></div><div class="bar s"><i style="width:'+v+'%"></i></div><div class="ft">'+pole(fi,v)+'</div></div>'}
  h+='</div>'});
 $("doms").innerHTML=h;
 var idx=[];for(var i=0;i<30;i++)if(res.f[i]!=null&&res.fc[i]>=2)idx.push(i);
 if(!idx.length)for(var i2=0;i2<30;i2++)if(res.f[i2]!=null)idx.push(i2);
 idx.sort(function(x,y){return Math.abs(res.f[y]-50)-Math.abs(res.f[x]-50)});
 $("stand").innerHTML="<ul>"+idx.slice(0,5).map(function(fi){var v=res.f[fi];return"<li><b style='color:var(--tx)'>"+t({en:F[fi][1],ar:F[fi][2]})+" ("+v+"%)</b>: "+pole(fi,v)+"</li>"}).join("")+"</ul>";
 var cm=COMBO.filter(function(c){return c[0](pp0)});
 $("combos").innerHTML=cm.length?"<ul>"+cm.map(function(c){return"<li>"+(lang==="ar"?c[2]:c[1])+"</li>"}).join("")+"</ul>":"<p>"+t(UI.none)+"</p>";
 var bad=res.sd>1.2||res.line||res.acq,mid=res.sd>1.0;
 $("qual").textContent=bad?t(UI.qbad):mid?t(UI.qmid):t(UI.qok);
 $("qual").className=bad?"warn":"";
}
$("share").onclick=function(){
 var p=res.p,a=arch(pl(p));
 var tx=(lang==="ar"?"نتيجتي في اختبار Big Five: "+a[2]+"\nالانفتاح "+(p.O==null?"-":p.O)+"% | الضمير "+(p.C==null?"-":p.C)+"% | الانبساط "+(p.E==null?"-":p.E)+"% | المقبولية "+(p.A==null?"-":p.A)+"% | العصابية "+(p.N==null?"-":p.N)+"%\nجرّبه: ":"My Big Five result: "+a[1]+"\nO "+(p.O==null?"-":p.O)+"% | C "+(p.C==null?"-":p.C)+"% | E "+(p.E==null?"-":p.E)+"% | A "+(p.A==null?"-":p.A)+"% | N "+(p.N==null?"-":p.N)+"%\nTry it: ")+location.href.split("#")[0].split("?")[0];
 if(navigator.share){navigator.share({title:"Big Five",text:tx}).catch(function(){})}
 else{
  var ok=function(){$("msg").textContent=t(UI.copied)};
  try{navigator.clipboard.writeText(tx).then(ok,fb)}catch(e){fb()}
  function fb(){var x=document.createElement("textarea");x.value=tx;document.body.appendChild(x);x.select();try{document.execCommand("copy");ok()}catch(e){$("msg").textContent=tx}document.body.removeChild(x)}
 }
};
if(/[?&]lang=ar/.test(location.search))lang="ar";
var sv=load();if(sv){var c=0;for(var k in sv)c++;if(c>0){ans=sv;$("resume").classList.remove("hide")}}
applyLang();
})();
</script>
</body>
